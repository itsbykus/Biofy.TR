# CI only. Hosting account /home/user has WordPress in public_html and Biofy.TR on subdomains;
# /home/user2 is a second account used for layout B (index.php looks for ../biofy).
<Directory /home/user>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>
<Directory /home/user2>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# WordPress (main domain)
<VirtualHost *:80>
    ServerName example.test
    DocumentRoot /var/www/html
</VirtualHost>

# Layout A: application outside public_html, document root = biofy/public
<VirtualHost *:80>
    ServerName bio.example.test
    DocumentRoot /home/user/biofy/public
</VirtualHost>

# Layout B: subdomain folder holds only the public files, application in ../biofy
<VirtualHost *:80>
    ServerName bio3.example.test
    DocumentRoot /home/user2/bio3.example.test
</VirtualHost>

# Layout C: whole package inside WordPress' public_html (subdomain folder public_html/bio2)
<VirtualHost *:80>
    ServerName bio2.example.test
    DocumentRoot /var/www/html/bio2
</VirtualHost>

# Biofy.TR on Coolify (build pack: "Docker Compose", file: /docker-compose.yml).
# Values come from Coolify's Environment Variables screen; nothing secret is stored in this file.
# Required: APP_URL, APP_KEY, DB_PASSWORD, DB_ROOT_PASSWORD and, for the first start, BIOFY_ADMIN_*.
# See docs/COOLIFY.md.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-Biofy.TR}
      APP_URL: ${APP_URL:?Set APP_URL, e.g. https://biofy.example.com}
      APP_KEY: ${APP_KEY:?Set APP_KEY (base64:... 32 random bytes), see docs/COOLIFY.md}
      APP_LOCALE: ${APP_LOCALE:-tr}
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-biofy}
      DB_USERNAME: ${DB_USERNAME:-biofy}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      # Coolify's proxy (Traefik) terminates HTTPS and is the only way into this container.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-*}
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
      BIOFY_TIMEZONE: ${BIOFY_TIMEZONE:-Europe/Istanbul}
      BIOFY_SCHEDULER: ${BIOFY_SCHEDULER:-true}
      BIOFY_BACKUP_BEFORE_MIGRATE: ${BIOFY_BACKUP_BEFORE_MIGRATE:-true}
      # First start only (creates the superadmin); can be removed afterwards.
      BIOFY_ADMIN_NAME: ${BIOFY_ADMIN_NAME:-Site Admin}
      BIOFY_ADMIN_USERNAME: ${BIOFY_ADMIN_USERNAME:-}
      BIOFY_ADMIN_EMAIL: ${BIOFY_ADMIN_EMAIL:-}
      BIOFY_ADMIN_PASSWORD: ${BIOFY_ADMIN_PASSWORD:-}
    volumes:
      - biofy-storage:/var/www/html/storage
      - biofy-media:/var/www/html/public/media
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "biofy-healthcheck"]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 5

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-biofy}
      MYSQL_USER: ${DB_USERNAME:-biofy}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD}
    volumes:
      - biofy-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root --password=\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10

volumes:
  biofy-storage:
  biofy-media:
  biofy-mysql:

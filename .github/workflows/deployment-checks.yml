name: Deployment checks

# End-to-end tests of the two supported deployment methods. They build what is actually
# deployed (the Docker image / the FTP release ZIP) and exercise it over HTTP.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coolify-docker:
    name: Coolify (Docker image + compose)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ci/docker-smoke.sh

  shared-hosting:
    name: Shared hosting with WordPress (FTP package)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, gd, intl, sodium, zip
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update -q && sudo apt-get install -y -q lftp
      - name: Build the FTP release package
        run: php scripts/build-release.php
      - run: bash scripts/ci/shared-hosting-smoke.sh
      - name: Keep the tested package
        uses: actions/upload-artifact@v4
        with:
          name: biofy-ftp-package
          path: |
            dist/*.zip
            dist/*.zip.sha256
          retention-days: 14

name: Release

# Pushing a tag such as v1.0.0 publishes:
#   - the Docker image to GitHub Packages: ghcr.io/<owner>/<repo>:<version>, :<major.minor>, :latest
#   - a GitHub release with the signed FTP package (shared hosting) and its SHA-256 file
# "Run workflow" with an existing tag republishes only the Docker image of that tag
# (e.g. after renaming the repository); the GitHub release is left untouched.
# The release signing key comes from the BIOFY_RELEASE_SIGNING_KEY secret; it is never stored in the repository.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag whose Docker image should be (re)published, e.g. v1.0.0
        required: true
      latest:
        description: Also move the "latest" image tag
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  # Public half of BIOFY_RELEASE_SIGNING_KEY. Installations pin it on first install, so a package
  # signed with any other key would fail their integrity check (bad_signature).
  RELEASE_PUBLIC_KEY: mUsYHBi0/DkwZChdck9pa7Hv2WzbAE6CV/6XXniqqEI=

jobs:
  version:
    name: Check tag against config/biofy.php
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - run: |
          version=$(grep -oP "'version' => '\K[^']+" config/biofy.php)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match config/biofy.php version $version"; exit 1
          fi

  docker-image:
    name: Docker image (GitHub Packages)
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"   # registry names must be lowercase
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' || inputs.latest }}
          labels: |
            org.opencontainers.image.title=Biofy.TR
            org.opencontainers.image.description=Multi-tenant link-in-bio SaaS (Laravel, Apache, PHP 8.4)
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.revision=${{ steps.image.outputs.revision }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ftp-package:
    name: FTP package (GitHub release)
    needs: docker-image
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, gd, intl, sodium, zip
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Release signing key
        env:
          SIGNING_KEY: ${{ secrets.BIOFY_RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::Secret BIOFY_RELEASE_SIGNING_KEY is missing; refusing to sign with a throw-away key"; exit 1
          fi
          umask 077
          printf '%s' "$SIGNING_KEY" > "$RUNNER_TEMP/release-signing.key"
          echo "BIOFY_SIGNING_KEY=$RUNNER_TEMP/release-signing.key" >> "$GITHUB_ENV"
      - run: php scripts/build-release.php   # also runs scripts/verify-release.php
      - name: Remove the key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release-signing.key"
      - name: Package is signed with the pinned release key
        run: php scripts/verify-release.php dist/biofy-tr-*.zip --public-key="$RELEASE_PUBLIC_KEY"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$version"
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          ## Biofy.TR $version

          | Deployment | Artifact |
          |---|---|
          | Shared (WordPress) hosting, FTP | \`biofy-tr-$version.zip\` below (check it against \`biofy-tr-$version.zip.sha256\`), then follow [docs/INSTALLATION.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/INSTALLATION.md) |
          | Coolify / Docker | Build from this repository ([docs/COOLIFY.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/COOLIFY.md)) or use the image \`$image\` |

          > **Shared hosting:** upload \`biofy-tr-$version.zip\` only. The "Source code (zip)" / "Source code (tar.gz)" archives that GitHub adds automatically contain neither \`vendor/\` nor \`public/build/\`; the installer stops with an explanation if they are uploaded. No Composer, npm or Node.js is needed on the server.
          >
          > **Paylaşımlı hosting:** yalnızca \`biofy-tr-$version.zip\` dosyasını yükleyin. GitHub'ın otomatik eklediği "Source code" arşivlerinde \`vendor/\` ve \`public/build/\` yoktur; sunucuda Composer, npm veya Node.js gerekmez.

          Release notes: [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/CHANGELOG.md)
          EOF
          gh release create "$GITHUB_REF_NAME" dist/biofy-tr-*.zip dist/biofy-tr-*.zip.sha256 \
            --title "Biofy.TR $version" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
      - name: Verify the published assets (as users download them)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir "$RUNNER_TEMP/published"
          gh release download "$GITHUB_REF_NAME" --pattern 'biofy-tr-*' --dir "$RUNNER_TEMP/published"
          php scripts/verify-release.php "$RUNNER_TEMP"/published/biofy-tr-*.zip --public-key="$RELEASE_PUBLIC_KEY"
